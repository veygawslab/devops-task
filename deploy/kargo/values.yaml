veyga-kargo:
  name: helloapp
  gitRepo: https://github.com/veygawslab/devops-task.git

  # each stage renders with ENVIRONMENT=<stage name> (dev, prod)
  render:
    environmentValueKey: veyga-microservice.environment

  # Kargo writes the promoted tag into the image (the chart takes repository:tag)
  images:
    - repoURL: 519915467343.dkr.ecr.us-east-1.amazonaws.com/veyga/helloapp
      helmValueKey: veyga-microservice.image.repository
      helmValuePrefix: "veyga/helloapp:"

  # dev: PR builds and releases, promoted by hand; prod: releases already verified in dev.
  # valuesFiles are repo-root relative and applied in order.
  stages:
    - name: dev
      warehouse: dev
      namespace: helloapp-dev # must match deploy/application.yaml
      valuesFiles:
        - deploy/manifests/bases/common/values.yaml
        - deploy/manifests/overlays/dev/values.yaml
    - name: prod
      warehouse: prod
      upstream: [dev]
      namespace: helloapp # must match deploy/application.yaml
      valuesFiles:
        - deploy/manifests/bases/common/values.yaml
        - deploy/manifests/overlays/prod/values.yaml
